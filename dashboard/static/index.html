<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Trader Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M2 12l4-5 3 3 5-7' fill='none' stroke='%231f8a64' stroke-width='2'/%3E%3C/svg%3E">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <div class="brand">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 12l4-5 3 3 5-7"/></svg>
        <span>Trader Desk</span>
      </div>
      <div class="market" id="market" aria-live="polite"><span class="dot"></span><span>Market status</span></div>
      <nav id="nav" aria-label="Sections"></nav>
      <p class="side-note">Research and planning only. This dashboard never places orders.</p>
    </aside>
    <main id="view" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
